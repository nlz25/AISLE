name: Deploy Contribute API

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribute-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: contribute-production
    defaults:
      run:
        working-directory: services/contribute
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - name: Prepare, migrate, and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ vars.CLOUDFLARE_D1_DATABASE_ID }}
          ACCESS_TEAM_DOMAIN: ${{ vars.ACCESS_TEAM_DOMAIN }}
          ACCESS_AUD: ${{ vars.ACCESS_AUD }}
          ADMIN_EMAILS: ${{ vars.ADMIN_EMAILS }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Configure the Cloudflare deployment token}"
          trap 'rm -f .wrangler/production-secrets.json' EXIT
          node prepare-deploy.mjs
          npx --no-install wrangler deploy --dry-run --config .wrangler/production.json
          npx --no-install wrangler d1 migrations apply DB --remote --config .wrangler/production.json
          npx --no-install wrangler deploy --config .wrangler/production.json --secrets-file .wrangler/production-secrets.json
