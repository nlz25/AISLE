<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>作品演示</title>
  <style>
    :root { color-scheme: light dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f6f8;
      color: #1f2328;
      padding: 32px 16px;
    }
    @media (prefers-color-scheme: dark) {
      body { background: #101214; color: #e8e8e8; }
    }
    main { width: min(960px, 100%); text-align: center; }
    h1 { font-size: 22px; font-weight: 600; letter-spacing: 0.5px; }
    .sub { margin-top: 8px; font-size: 14px; opacity: 0.6; }
    video {
      width: 100%;
      margin-top: 20px;
      border-radius: 12px;
      background: #000;
      box-shadow: 0 10px 34px rgba(0, 0, 0, 0.14);
    }
    footer { margin-top: 16px; font-size: 12px; opacity: 0.45; }
  </style>
</head>
<body>
  <main>
    <!-- ✏️ 改这里：标题，以及你的姓名和求职岗位 -->
    <h1>项目作品演示</h1>
    <p class="sub">你的名字 · 求职岗位</p>

    <video src="demo.mp4" controls playsinline preload="metadata" controlslist="nodownload"></video>

    <footer>© 2026</footer>
  </main>
</body>
</html>
